<!doctype html>
<html lang="pt-BR">
<head>
    <title>p5js</title>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: #1b1b1b;
        }
    </style>
    <script src="./scripts/p5.js"></script>
    <script>
        let gradient_y = 0;

        function setup() {
            createCanvas(800, 800);
        }

        function draw() {
            background(250, 0, 100);
            gradient_y = mouseY; /* = random(255); */
            const iterate_height = height / 20;
            for (let i = 0; i <= iterate_height; i++) {
                fill(map(gradient_y, 0, height, 0, 255) - i * 3);
                stroke(map(gradient_y, 0, height, 255, 0) - i);
                rect(0, i * 20, width, 10);
            }
        }
    </script>
</head>

<body></body>
</html>
